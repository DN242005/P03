<ui:composition template="/faces/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
<ui:define name="contenido">

    <h2>Catalogo de productos (Web 2.0 - JSF/PrimeFaces)</h2>

    <h:form id="formCatalogo">
        <p:growl id="mensajes" showDetail="true"/>

        <p:toolbar>
            <p:toolbarGroup>
                <p:selectBooleanCheckbox value="#{productoBean.soloAlerta}" itemLabel="Mostrar solo alertas de stock bajo">
                    <p:ajax event="change" listener="#{productoBean.alternarFiltroAlerta}" update="tablaProductos"/>
                </p:selectBooleanCheckbox>
            </p:toolbarGroup>
        </p:toolbar>

        <p:dataTable id="tablaProductos" var="p" value="#{productoBean.productos}"
                     paginator="true" rows="10" filteredValue="#{productoBean.productos}"
                     emptyMessage="No hay productos que mostrar."
                     rowStyleClass="#{p.alertaStockBajo ? 'fila-alerta' : null}">
            <p:column headerText="Codigo" filterBy="#{p.codigo}" filterMatchMode="contains" sortBy="#{p.codigo}">
                <h:outputText value="#{p.codigo}"/>
            </p:column>
            <p:column headerText="Nombre" filterBy="#{p.nombre}" filterMatchMode="contains" sortBy="#{p.nombre}">
                <h:outputText value="#{p.nombre}"/>
            </p:column>
            <p:column headerText="Categoria" filterBy="#{p.nombreCategoria}" filterMatchMode="contains">
                <h:outputText value="#{p.nombreCategoria}"/>
            </p:column>
            <p:column headerText="Unidad">
                <h:outputText value="#{p.unidadMedida}"/>
            </p:column>
            <p:column headerText="Existencia" sortBy="#{p.existencia}">
                <h:outputText value="#{p.existencia}"/>
            </p:column>
            <p:column headerText="Minimo" sortBy="#{p.minimoPermitido}">
                <h:outputText value="#{p.minimoPermitido}"/>
            </p:column>
            <p:column headerText="Estado">
                <h:outputText value="ALERTA" rendered="#{p.alertaStockBajo}" styleClass="estado-alerta"/>
                <h:outputText value="Normal" rendered="#{!p.alertaStockBajo}" styleClass="estado-normal"/>
            </p:column>
        </p:dataTable>
    </h:form>

    <h3>Registrar nuevo producto</h3>
    <h:form id="formNuevoProducto">
        <p:messages id="mensajesForm" showDetail="true"/>
        <p:panelGrid columns="2" columnClasses="etiqueta,campo">
            <h:outputLabel for="codigo" value="Codigo"/>
            <p:inputText id="codigo" value="#{productoBean.nuevo.codigo}" required="true"
                         requiredMessage="El codigo es obligatorio." maxlength="30">
                <f:validateLength minimum="2" maximum="30"/>
            </p:inputText>

            <h:outputLabel for="nombre" value="Nombre"/>
            <p:inputText id="nombre" value="#{productoBean.nuevo.nombre}" required="true"
                         requiredMessage="El nombre es obligatorio." maxlength="120">
                <f:validateLength minimum="2" maximum="120"/>
            </p:inputText>

            <h:outputLabel for="categoria" value="Categoria"/>
            <p:selectOneMenu id="categoria" value="#{productoBean.nuevo.idCategoria}" required="true">
                <f:selectItem itemLabel="Selecciona una categoria" itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItems value="#{productoBean.categorias}" var="c" itemLabel="#{c.nombre}" itemValue="#{c.idCategoria}"/>
            </p:selectOneMenu>

            <h:outputLabel for="unidad" value="Unidad de medida"/>
            <p:inputText id="unidad" value="#{productoBean.nuevo.unidadMedida}" required="true"
                         requiredMessage="La unidad de medida es obligatoria." maxlength="20"/>

            <h:outputLabel for="minimo" value="Minimo permitido"/>
            <p:inputNumber id="minimo" value="#{productoBean.nuevo.minimoPermitido}" minValue="0" decimalPlaces="2"
                           required="true" requiredMessage="El minimo permitido es obligatorio."/>
        </p:panelGrid>

        <p:commandButton value="Guardar producto" action="#{productoBean.guardarNuevo}"
                          update="formNuevoProducto formCatalogo:tablaProductos"/>
    </h:form>

</ui:define>
</ui:composition>
