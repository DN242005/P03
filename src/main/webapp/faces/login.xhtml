<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>PR01 - Iniciar sesion</title>
        <h:outputStylesheet library="css" name="estilo.css"/>
    </h:head>
    <h:body>
        <main class="login">
            <h1>PR01. Control de inventario</h1>
            <p>Selecciona un usuario de prueba para iniciar la sesion.</p>
            <h:form id="formLogin">
                <p:messages id="mensajes" showDetail="true"/>
                <h:outputLabel for="usuario" value="Usuario"/>
                <p:selectOneMenu id="usuario" value="#{sesionBean.idUsuarioSeleccionado}" required="true"
                                 requiredMessage="Selecciona un usuario.">
                    <f:selectItem itemLabel="Selecciona un usuario" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{sesionBean.usuarios}" var="u"
                                   itemLabel="#{u.nombre} - #{u.rol}" itemValue="#{u.idUsuario}"/>
                </p:selectOneMenu>
                <p:commandButton value="Iniciar sesion" action="#{sesionBean.iniciarSesion}"
                                 process="@form" update="formLogin"/>
            </h:form>
        </main>
    </h:body>
</ui:composition>
